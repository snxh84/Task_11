<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thala 7 Sneaker Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">Thala<span>7.</span></a>

      <nav class="nav-menu">
        <a href="index.html" class="active">Home</a>
        <a href="#">About</a>
        <a href="#">Brands <i class="caret"></i></a>
        <a href="#">More <i class="caret"></i></a>
        <a href="#">Contact</a>
      </nav>

      <div class="nav-actions">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.7" y2="16.7"></line>
          </svg>
          <input type="search" placeholder="Search">
        </div>

        <a href="cart.html" class="icon-btn" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-badge">0</span>
        </a>

        <img class="avatar" src="https://i.pravatar.cc/80?img=12" alt="Profile">
      </div>
    </div>
  </header>

  <main>

    <!-- Hero : two divs (description + image) -->
    <section class="hero" id="home">
      <div class="container hero-inner">
        <div class="hero-copy">
          <div class="seven-logo">
            <span class="word">sE7<i>E</i>n</span>
            <span class="sub">By M.S. Dhoni</span>
          </div>
          <h1>7!! Thala For a <em>Reason!</em></h1>
          <p>Lorem ipsum dolor sit amet consectetur. Pretium quisque lorem feugiat justo at ut orci nisi.</p>
          <a href="product.html" class="btn btn-dark">Shop Now</a>
        </div>

        <div class="hero-art">
          <img class="hero-shoe" src="images/hero-shoe.jpg" alt="Thala 7 sneaker">
        </div>
      </div>
    </section>

    <!-- Service strip (full width, Flexbox) -->
    <section class="service-strip">
      <div class="container">
        <div class="service-item">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.9L3 21l2-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"></path>
            <path d="m12 8 1.2 2.4 2.6.4-1.9 1.8.5 2.6L12 14l-2.4 1.2.5-2.6L8.2 10.8l2.6-.4z"></path>
          </svg>
          <div>
            <strong>2k+</strong>
            <span>Reviews</span>
          </div>
        </div>

        <div class="service-item">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="7" r="3"></circle>
            <circle cx="17" cy="9" r="2.4"></circle>
            <path d="M3 20v-1.5A4.5 4.5 0 0 1 7.5 14h3A4.5 4.5 0 0 1 15 18.5V20"></path>
            <path d="M17 14h.5A3.5 3.5 0 0 1 21 17.5V20"></path>
          </svg>
          <div>
            <strong>30k+</strong>
            <span>Customers</span>
          </div>
        </div>

        <div class="service-item">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.5 14.6 8l5.9.7-4.4 4 1.2 5.8L12 15.7 6.7 18.5l1.2-5.8-4.4-4L9.4 8z"></path>
            <path d="M12 15.7V22"></path>
          </svg>
          <div>
            <strong>High</strong>
            <span>Quality</span>
          </div>
        </div>

        <div class="service-item">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3 2.6 5.3 5.9.8-4.3 4.1 1 5.8L12 16.3 6.8 19l1-5.8-4.3-4.1 5.9-.8z"></path>
            <path d="m5 21 2-1.2M19 21l-2-1.2"></path>
          </svg>
          <div>
            <strong>4.5/5</strong>
            <span>Rating</span>
          </div>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
